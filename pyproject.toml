[tool.ruff]
line-length = 100
target-version = "py312"

# Choose rule sets you like (pycodestyle E/W, pyflakes F, bugbear B, isort I, pyupgrade UP, etc.)
select = ["E", "F", "B", "I", "UP"]

# Turn off the ones that block your preferred style
ignore = [
    "E701", # multiple statements on one line (colon)
    "E741", # ambiguous variable name
]
