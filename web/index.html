<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toy-vm</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #111; color: #ddd; font: 16px/1.4 system-ui, sans-serif;
  }
  #ui { text-align: center; }
  #ui h1 { font-weight: 600; font-size: 1.25rem; margin: 0 0 1rem; letter-spacing: 0.04em; }
  #games { display: flex; flex-direction: column; gap: 0.5rem; align-items: stretch; min-width: 12rem; }
  #games button {
    appearance: none; border: 1px solid #444; background: #1a1a1a; color: inherit;
    padding: 0.6rem 1rem; border-radius: 4px; cursor: pointer; font: inherit;
  }
  #games button:hover { background: #252525; border-color: #666; }
  #play { display: none; }
  canvas {
    /* grow with the window; 320:180 aspect, leave room for the hint */
    width: min(100vw, calc((100vh - 3rem) * 320 / 180));
    height: auto; image-rendering: pixelated;
    background: #000; vertical-align: middle;
  }
  #hint { margin-top: 0.75rem; font-size: 0.8rem; color: #888; }
  #err { color: #f66; margin-top: 0.75rem; max-width: 36rem; }
</style>
</head>
<body>
<div id="ui">
  <h1>toy-vm</h1>
  <div id="games"></div>
  <div id="play">
    <canvas id="screen" width="320" height="180"></canvas>
    <div id="hint">arrows · X · Z/C · Esc = menu</div>
  </div>
  <div id="err"></div>
</div>
<script>
"use strict";

const GAMES = [
  { id: "game-breakout", title: "Breakout" },
];

const SCREEN_W = 320, SCREEN_H = 180;
const MEM_SIZE = 1 << 20;
const STEP_LIMIT = 1000000;
const VOICES = 4;

const BTN_UP = 0;
const BTN_DOWN = 1;
const BTN_LEFT = 2;
const BTN_RIGHT = 3;
const BTN_A = 4;
const BTN_B = 5;
const BTN_MENU = 6;

const INT_PRINT = 1;
const INT_SPRITE = 2;
const INT_SOUND = 3;
const INT_RAND = 4;
const INT_SQRT = 5;

const FLIP_H = 1;
const FLIP_V = 2;

// Address modes / ops — match src/vm.cpp
const NIL = 0, ABS = 1, IND = 2, IDX = 3, ZRO = 4, ONE = 5, NEG = 6, IMM = 7, NXT = 8, PDA = NIL;
const RET = 0, JLT = 1, JLE = 2, JGT = 3, JGE = 4, JEQ = 5, JNE = 6, JMP = 7, JSR = 8;
const MOV = 9, ADD = 10, SUB = 11, MUL = 12, DIV = 13, MOD = 14, AND = 15, ORE = 16, CMP = 17, INT = 18;

// Keep in sync with OPCODE_TABLE in src/vm.cpp
const OPCODE_TABLE = (() => {
  const t = [];
  const op = (o, a = NIL, b = NIL) => t.push([o, a, b]);

  op(RET);

  op(INT, NIL, IMM);

  op(JLT, NIL, IMM);
  op(JLE, NIL, IMM);
  op(JGT, NIL, IMM);
  op(JGE, NIL, IMM);
  op(JEQ, NIL, IMM);
  op(JNE, NIL, IMM);
  op(JMP, NIL, IMM);
  op(JSR, NIL, IMM);

  op(MOV, ABS, ABS);
  op(MOV, ABS, IND);
  op(MOV, ABS, IDX);
  op(MOV, ABS, IMM);
  op(MOV, ABS, ZRO);
  op(MOV, IND, ABS);
  op(MOV, IND, IND);
  op(MOV, IND, IDX);
  op(MOV, IND, IMM);
  op(MOV, IND, ZRO);
  op(MOV, IDX, ABS);
  op(MOV, IDX, IND);
  op(MOV, IDX, IDX);
  op(MOV, IDX, IMM);
  op(MOV, IDX, ZRO);
  op(MOV, NXT, ABS);
  op(MOV, NXT, IND);
  op(MOV, NXT, IDX);
  op(MOV, NXT, IMM);
  op(MOV, NXT, ZRO);
  op(MOV, NXT, NXT);

  op(CMP, ABS, ABS);
  op(CMP, ABS, IND);
  op(CMP, ABS, IDX);
  op(CMP, ABS, IMM);
  op(CMP, ABS, ZRO);
  op(CMP, IND, ABS);
  op(CMP, IND, IND);
  op(CMP, IND, IDX);
  op(CMP, IND, IMM);
  op(CMP, IND, ZRO);
  op(CMP, IDX, ABS);
  op(CMP, IDX, IND);
  op(CMP, IDX, IDX);
  op(CMP, IDX, IMM);
  op(CMP, IDX, ZRO);
  op(CMP, PDA, ABS);
  op(CMP, PDA, IND);
  op(CMP, PDA, IDX);
  op(CMP, PDA, IMM);
  op(CMP, PDA, ZRO);

  op(ADD, ABS, ABS);
  op(ADD, ABS, IND);
  op(ADD, ABS, IDX);
  op(ADD, ABS, IMM);
  op(ADD, ABS, ONE);
  op(ADD, IND, ABS);
  op(ADD, IND, IND);
  op(ADD, IND, IDX);
  op(ADD, IND, IMM);
  op(ADD, IND, ONE);
  op(ADD, IDX, ABS);
  op(ADD, IDX, IND);
  op(ADD, IDX, IDX);
  op(ADD, IDX, IMM);
  op(ADD, IDX, ONE);
  op(ADD, PDA, ABS);
  op(ADD, PDA, IND);
  op(ADD, PDA, IDX);
  op(ADD, PDA, IMM);
  op(ADD, PDA, ONE);

  op(SUB, ABS, ABS);
  op(SUB, ABS, IND);
  op(SUB, ABS, IDX);
  op(SUB, ABS, IMM);
  op(SUB, IND, ABS);
  op(SUB, IND, IND);
  op(SUB, IND, IDX);
  op(SUB, IND, IMM);
  op(SUB, IDX, ABS);
  op(SUB, IDX, IND);
  op(SUB, IDX, IDX);
  op(SUB, IDX, IMM);
  op(SUB, PDA, ABS);
  op(SUB, PDA, IND);
  op(SUB, PDA, IDX);
  op(SUB, PDA, IMM);

  op(MUL, ABS, ABS);
  op(MUL, ABS, IND);
  op(MUL, ABS, IDX);
  op(MUL, ABS, IMM);
  op(MUL, IND, ABS);
  op(MUL, IND, IND);
  op(MUL, IND, IDX);
  op(MUL, IND, IMM);
  op(MUL, IDX, ABS);
  op(MUL, IDX, IND);
  op(MUL, IDX, IDX);
  op(MUL, IDX, IMM);
  op(MUL, IDX, NEG);
  op(MUL, PDA, ABS);
  op(MUL, PDA, IND);
  op(MUL, PDA, IDX);
  op(MUL, PDA, IMM);
  op(MUL, PDA, NEG);

  op(DIV, ABS, ABS);
  op(DIV, ABS, IND);
  op(DIV, ABS, IDX);
  op(DIV, ABS, IMM);
  op(DIV, IND, ABS);
  op(DIV, IND, IND);
  op(DIV, IND, IDX);
  op(DIV, IND, IMM);
  op(DIV, IDX, ABS);
  op(DIV, IDX, IND);
  op(DIV, IDX, IDX);
  op(DIV, IDX, IMM);
  op(DIV, PDA, ABS);
  op(DIV, PDA, IND);
  op(DIV, PDA, IDX);
  op(DIV, PDA, IMM);

  op(MOD, ABS, ABS);
  op(MOD, ABS, IND);
  op(MOD, ABS, IDX);
  op(MOD, ABS, IMM);
  op(MOD, IND, ABS);
  op(MOD, IND, IND);
  op(MOD, IND, IDX);
  op(MOD, IND, IMM);
  op(MOD, IDX, ABS);
  op(MOD, IDX, IND);
  op(MOD, IDX, IDX);
  op(MOD, IDX, IMM);
  op(MOD, PDA, ABS);
  op(MOD, PDA, IND);
  op(MOD, PDA, IDX);
  op(MOD, PDA, IMM);

  op(AND, ABS, ABS);
  op(AND, ABS, IND);
  op(AND, ABS, IDX);
  op(AND, ABS, IMM);
  op(AND, IND, ABS);
  op(AND, IND, IND);
  op(AND, IND, IDX);
  op(AND, IND, IMM);
  op(AND, IDX, ABS);
  op(AND, IDX, IND);
  op(AND, IDX, IDX);
  op(AND, IDX, IMM);
  op(AND, PDA, ABS);
  op(AND, PDA, IND);
  op(AND, PDA, IDX);
  op(AND, PDA, IMM);

  op(ORE, ABS, ABS);
  op(ORE, ABS, IND);
  op(ORE, ABS, IDX);
  op(ORE, ABS, IMM);
  op(ORE, IND, ABS);
  op(ORE, IND, IND);
  op(ORE, IND, IDX);
  op(ORE, IND, IMM);
  op(ORE, IDX, ABS);
  op(ORE, IDX, IND);
  op(ORE, IDX, IDX);
  op(ORE, IDX, IMM);
  op(ORE, PDA, ABS);
  op(ORE, PDA, IND);
  op(ORE, PDA, IDX);
  op(ORE, PDA, IMM);

  return t;
})();

function decodeVarint(bytes, pos) {
  let u = 0, shift = 0;
  for (;;) {
    const b = bytes[pos.i++];
    u = (u | ((b & 0x7f) << shift)) >>> 0;
    if (b < 0x80) break;
    shift += 7;
  }
  return (u << 4) >> 4;
}

function loadProgram(bytes) {
  const pos = { i: 0 };
  const mem = new Int32Array(MEM_SIZE);
  const base = decodeVarint(bytes, pos);
  let size = decodeVarint(bytes, pos);
  for (let i = 0; i < size; i++) mem[base + i] = decodeVarint(bytes, pos);
  size = decodeVarint(bytes, pos);
  const code = new Int32Array(size);
  for (let i = 0; i < size; i++) code[i] = decodeVarint(bytes, pos);
  return { mem, code };
}

function runVM(mem, code) {
  let pc = 0;
  const stack = [];
  let ai = 0, b = 0, c = 0, res = 0;
  const next = () => {
    if (pc < 0 || pc >= code.length) throw new Error("bad pc " + pc);
    return code[pc++];
  };
  const at = (addr) => {
    addr |= 0;
    if (addr < 0 || addr >= MEM_SIZE) throw new Error("bad mem addr " + addr);
    return addr;
  };
  for (let steps = 0; steps < STEP_LIMIT; steps++) {
    const o = next();
    if (o < 0 || o >= OPCODE_TABLE.length) throw new Error("illegal opcode " + o);
    const [op, am, bm] = OPCODE_TABLE[o];
    if (am === ABS) ai = at(next());
    if (am === IND) ai = at(mem[at(next())]);
    if (am === NXT) ai = (ai + 1) | 0;
    if (am === IDX) { b = mem[at(next())]; ai = at((b + next()) | 0); }
    if (bm === ZRO) b = 0;
    if (bm === ONE) b = 1;
    if (bm === NEG) b = -1;
    if (bm === IMM) b = next();
    if (bm === ABS) { c = at(next()); b = mem[c]; }
    if (bm === IND) { c = at(mem[at(next())]); b = mem[c]; }
    if (bm === IDX) { b = mem[at(next())]; c = at((b + next()) | 0); b = mem[c]; }
    if (bm === NXT) { c = (c + 1) | 0; b = mem[at(c)]; }
    switch (op) {
      case MOV: res = mem[ai] = b; break;
      case ADD: res = mem[ai] = (mem[ai] + b) | 0; break;
      case SUB: res = mem[ai] = (mem[ai] - b) | 0; break;
      case MUL: res = mem[ai] = Math.imul(mem[ai], b); break;
      case DIV: { const d = b || 1; res = mem[ai] = (mem[ai] / d) | 0; break; }
      case MOD: { const d = b || 1; res = mem[ai] = (mem[ai] % d) | 0; break; }
      case AND: res = mem[ai] = mem[ai] & b; break;
      case ORE: res = mem[ai] = mem[ai] | b; break;
      case CMP: res = (mem[ai] - b) | 0; break;
      case JLT: if (res < 0) pc = b; break;
      case JLE: if (res <= 0) pc = b; break;
      case JGT: if (res > 0) pc = b; break;
      case JGE: if (res >= 0) pc = b; break;
      case JEQ: if (res === 0) pc = b; break;
      case JNE: if (res !== 0) pc = b; break;
      case JMP: pc = b; break;
      case JSR: stack.push(pc); pc = b; break;
      case RET:
        if (!stack.length) return;
        pc = stack.pop();
        break;
      case INT: interrupt(b); break;
      default: throw new Error("bad op " + op);
    }
  }
  throw new Error("step limit reached");
}

const APU_WORKLET = `
const VOICES = 4;
const SAW = 1, TRI = 2, PULSE = 3, NOISE = 4;

function noiseNibble(s) {
  return (((s >>> 22) & 1) << 7) |
         (((s >>> 20) & 1) << 6) |
         (((s >>> 16) & 1) << 5) |
         (((s >>> 13) & 1) << 4) |
         (((s >>> 11) & 1) << 3) |
         (((s >>>  7) & 1) << 2) |
         (((s >>>  4) & 1) << 1) |
         (((s >>>  2) & 1) << 0);
}

class ToyAPU extends AudioWorkletProcessor {
  constructor() {
    super();
    this.voices = Array.from({ length: VOICES }, () => ({
      pitch: 0, pw: 0, vol: 0, wave: 0, phase: 0, noise: 0, shift: 1234567,
    }));
    this.inputs = null;
    this.sample = 0;
    this.frameLen = Math.max(1, (sampleRate / 60) | 0);
    this.port.onmessage = (e) => {
      if (e.data && e.data.type === "voices") this.inputs = e.data.voices;
    };
  }
  config() {
    for (let i = 0; i < VOICES; i++) {
      const v = this.voices[i], m = this.inputs[i];
      v.pitch = Math.pow(2, (m.pitch * (1 / 8) - 57) * (1 / 12)) * (440 / sampleRate);
      v.pw = (m.pw % 256) / 256;
      v.vol = Math.min(1, Math.max(0, m.vol * (1 / 256))) * 0.5;
      v.wave = m.wave;
      if (v.wave === NOISE) v.pitch *= 8;
    }
  }
  process(_ins, outs) {
    const out = outs[0][0];
    if (!out || !this.inputs) return true;
    for (let i = 0; i < out.length; i++) {
      if (this.sample === 0) this.config();
      let x = 0;
      for (const v of this.voices) {
        v.phase += v.pitch;
        v.phase -= v.phase | 0;
        let s = 0;
        if (v.wave === SAW) s = v.phase * 2 - 1;
        if (v.wave === TRI) s = 1 - 2 * Math.abs(2 * v.phase - 1);
        if (v.wave === PULSE) s = v.phase <= v.pw ? -1 : 1;
        if (v.wave === NOISE) {
          if (v.phase < v.pitch) {
            v.shift = ((v.shift << 1) | (((v.shift >>> 22) ^ (v.shift >>> 17)) & 1)) >>> 0;
            v.noise = noiseNibble(v.shift) * (1 / 128) - 1;
          }
          s = v.noise;
        }
        x += s * v.vol;
      }
      out[i] = x;
      this.sample++;
      if (this.sample >= this.frameLen) this.sample = 0;
    }
    return true;
  }
}
registerProcessor("toy-apu", ToyAPU);
`;

const gamesEl = document.getElementById("games");
const playEl = document.getElementById("play");
const errEl = document.getElementById("err");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const FRAME_MS = 1000 / 60;

let audioCtx = null;
let apuNode = null;
let running = false;
let raf = 0;
let mem = null;
let code = null;
let sprites = null;
let keys = new Set();
let voiceInputs = null;
let nextFrameTime = 0;

function showError(msg) {
  errEl.textContent = msg || "";
}

// Browsers block audio until a click/key — only call this from input handlers.
async function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new AudioContext({ sampleRate: 48000 });
  await audioCtx.resume();
  const url = URL.createObjectURL(new Blob([APU_WORKLET], { type: "application/javascript" }));
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  apuNode = new AudioWorkletNode(audioCtx, "toy-apu");
  apuNode.connect(audioCtx.destination);
}

function interrupt(n) {
  if (n === INT_SPRITE) {
    const x = mem[2], y = mem[3], w = mem[4], h = mem[5];
    const s = mem[6], t = mem[7], f = mem[8];
    ctx.save();
    if (f & (FLIP_H | FLIP_V)) {
      ctx.translate(x + (f & FLIP_H ? w : 0), y + (f & FLIP_V ? h : 0));
      ctx.scale(f & FLIP_H ? -1 : 1, f & FLIP_V ? -1 : 1);
      ctx.drawImage(sprites, s, t, w, h, 0, 0, w, h);
    } else {
      ctx.drawImage(sprites, s, t, w, h, x, y, w, h);
    }
    ctx.restore();
  } else if (n === INT_SOUND) {
    const i = mem[2];
    if (i >= 0 && i < VOICES) {
      voiceInputs[i] = { pitch: mem[3], pw: mem[4], vol: mem[5], wave: mem[6] };
    }
  } else if (n === INT_RAND) {
    const lo = mem[2], hi = mem[3];
    mem[0] = lo + Math.floor(Math.random() * (hi - lo + 1));
  } else if (n === INT_SQRT) {
    mem[0] = Math.sqrt(mem[2]) | 0;
  } else if (n === INT_PRINT) {
    let msg = "", addr = mem[2];
    while (addr >= 0 && addr < MEM_SIZE) {
      const c = mem[addr++];
      if (c === 0) break;
      msg += String.fromCharCode(c);
    }
    console.log(msg);
  } else {
    throw new Error("unknown interrupt " + n);
  }
}

function pollInput() {
  let b = 0;
  if (keys.has("ArrowLeft") || keys.has("a")) b |= 1 << BTN_LEFT;
  if (keys.has("ArrowRight") || keys.has("d")) b |= 1 << BTN_RIGHT;
  if (keys.has("ArrowUp") || keys.has("w")) b |= 1 << BTN_UP;
  if (keys.has("ArrowDown") || keys.has("s")) b |= 1 << BTN_DOWN;
  if (keys.has("x")) b |= 1 << BTN_A;
  if (keys.has("z") || keys.has("c")) b |= 1 << BTN_B;
  if (keys.has("Enter")) b |= 1 << BTN_MENU;
  mem[1] = b;
}

function frame(timestamp) {
  if (!running) return;
  if (!nextFrameTime) nextFrameTime = timestamp;

  if (timestamp >= nextFrameTime) {
    nextFrameTime += FRAME_MS;
    // Behind: skip catch-up rather than running multiple sim steps
    if (nextFrameTime < timestamp) nextFrameTime = timestamp;
    try {
      pollInput();
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
      runVM(mem, code);
      if (apuNode) apuNode.port.postMessage({ type: "voices", voices: voiceInputs });
    } catch (e) {
      showError(String(e.message || e));
      stopGame();
      return;
    }
  }
  raf = requestAnimationFrame(frame);
}

function setGameQuery(gameId) {
  const url = new URL(location.href);
  if (gameId) url.searchParams.set("game", gameId);
  else url.searchParams.delete("game");
  history.replaceState(null, "", url);
}

function stopGame() {
  running = false;
  cancelAnimationFrame(raf);
  if (apuNode) apuNode.port.postMessage({ type: "voices", voices: null });
  voiceInputs = null;
  playEl.style.display = "none";
  gamesEl.style.display = "flex";
  document.querySelector("#ui h1").style.display = "";
  setGameQuery(null);
}

async function startGame(gameId) {
  showError("");
  try {
    const base = "../" + gameId + "/";
    const [codeRes, spriteRes] = await Promise.all([
      fetch(base + "code"),
      fetch(base + "sprite.png"),
    ]);
    if (!codeRes.ok) throw new Error("failed to load " + gameId + "/code");
    if (!spriteRes.ok) throw new Error("failed to load " + gameId + "/sprite.png");
    const codeBuf = await codeRes.arrayBuffer();
    sprites = await createImageBitmap(await spriteRes.blob());
    ({ mem, code } = loadProgram(new Uint8Array(codeBuf)));
    voiceInputs = Array.from({ length: VOICES }, () => ({ pitch: 0, pw: 0, vol: 0, wave: 0 }));
    gamesEl.style.display = "none";
    document.querySelector("#ui h1").style.display = "none";
    playEl.style.display = "block";
    setGameQuery(gameId);
    nextFrameTime = 0;
    running = true;
    raf = requestAnimationFrame(frame);
  } catch (e) {
    showError(String(e.message || e) + " — serve from repo root: python -m http.server");
  }
}

for (const g of GAMES) {
  const btn = document.createElement("button");
  btn.textContent = g.title;
  btn.onclick = () => startGame(g.id);
  gamesEl.appendChild(btn);
}

const bootGame = new URLSearchParams(location.search).get("game");
if (bootGame) startGame(bootGame);

window.addEventListener("pointerdown", () => ensureAudio());
window.addEventListener("keydown", (e) => {
  ensureAudio();
  keys.add(e.key.length === 1 ? e.key.toLowerCase() : e.key);
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Escape"].includes(e.key)) e.preventDefault();
  if (e.key === "Escape" && running) stopGame();
});
window.addEventListener("keyup", (e) => {
  keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key);
});
</script>
</body>
</html>
